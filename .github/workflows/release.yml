name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build (Release)
        shell: pwsh
        run: |
          $sln = (Get-ChildItem -Filter *.sln | Select-Object -First 1).FullName
          msbuild "$sln" /p:Configuration=Release /m /nologo /v:minimal

      - name: Package
        shell: pwsh
        run: |
          $out = "Presentacion/bin/Release"
          $pkg = "LibraryManagementSystem"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item "$out/*.exe", "$out/*.exe.config", "$out/*.dll" $pkg
          Compress-Archive -Path $pkg -DestinationPath "$pkg-${{ github.ref_name }}.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: LibraryManagementSystem-${{ github.ref_name }}.zip
          generate_release_notes: true
